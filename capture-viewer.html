<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JSONL Capture Viewer</title>
<style>
/* ── Reset & base ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-base: #1a1a2e;
  --bg-sunken: #141425;
  --bg-elevated: #222240;
  --bg-hover: #2a2a4a;
  --border: #333360;
  --text-primary: #e0e0f0;
  --text-muted: #8888aa;
  --text-faint: #5a5a7a;
  --accent-primary: #6c7aff;
  --accent-secondary: #c792ea;
  --success: #80cbc4;
  --needs-input: #ff6b6b;
  --radius-sm: 4px;
  --radius-md: 8px;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
}

html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  background: var(--bg-base);
  color: var(--text-primary);
  overflow: hidden;
}

#root { height: 100%; }

/* ── Layout ────────────────────────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  background: var(--bg-sunken);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
}

.header-spacer { flex: 1; }

.load-btn {
  background: var(--accent-primary);
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.load-btn:hover { filter: brightness(1.15); }

.main-content {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ───────────────────────────────────────────────────────────── */
.sidebar {
  width: 240px;
  min-width: 200px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg-sunken);
  flex-shrink: 0;
}

.sidebar-header {
  padding: 8px 12px;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.sidebar-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: var(--text-xs);
  color: var(--text-muted);
  border-left: 3px solid transparent;
  transition: background 0.1s;
}
.sidebar-item:hover { background: var(--bg-hover); }
.sidebar-item-active {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border-left-color: var(--accent-primary);
}

.sidebar-item-index {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  min-width: 28px;
}

.sidebar-item-info {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.sidebar-item-time {
  font-family: var(--font-mono);
  font-size: 11px;
}

.sidebar-item-meta {
  font-size: 10px;
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Conversation panel ────────────────────────────────────────────────── */
.conversation-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.request-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 10px 16px;
  font-size: var(--text-xs);
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: var(--bg-sunken);
  flex-shrink: 0;
}

.meta-item {
  display: flex;
  gap: 4px;
}

.meta-label { color: var(--text-faint); }
.meta-value { color: var(--text-primary); font-family: var(--font-mono); }

.conversation-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
}

.view-full-btn {
  display: block;
  margin: 16px auto;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  cursor: pointer;
}
.view-full-btn:hover {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #fff;
}

/* ── Message blocks ────────────────────────────────────────────────────── */
.message-block {
  margin-bottom: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.1s;
}
.message-block:hover { border-color: var(--accent-primary); }

.message-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  font-size: var(--text-xs);
  font-weight: 600;
}

.role-user .message-header { background: #1a2a3a; color: #7ec8e3; }
.role-assistant .message-header { background: #1a2a1a; color: #80cbc4; }
.role-system .message-header { background: #2a2a1a; color: #d4aa7d; }

.message-body {
  padding: 8px 12px;
  font-size: var(--text-sm);
  line-height: 1.5;
  background: var(--bg-base);
}

.content-block { margin-bottom: 6px; }
.content-block:last-child { margin-bottom: 0; }

.text-content { white-space: pre-wrap; word-break: break-word; }

.tool-block {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.tool-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  background: var(--bg-sunken);
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
}
.tool-header:hover { color: var(--text-primary); }

.tool-toggle {
  font-size: 9px;
  color: var(--text-faint);
  width: 12px;
}

.tool-name { color: var(--accent-secondary); font-weight: 600; }
.tool-id { color: var(--text-faint); font-size: 10px; }

.tool-body {
  padding: 6px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.4;
  background: var(--bg-base);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
  color: var(--text-muted);
}

.tool-error { color: var(--needs-input); }

/* ── Delta marker ──────────────────────────────────────────────────────── */
.delta-marker {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
  font-size: 11px;
  color: var(--accent-primary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.delta-marker::before, .delta-marker::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--accent-primary);
  opacity: 0.4;
}

/* ── Thinking block ────────────────────────────────────────────────────── */
.thinking-block {
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.thinking-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 11px;
  background: var(--bg-sunken);
  color: var(--text-faint);
  cursor: pointer;
  user-select: none;
  font-style: italic;
}
.thinking-header:hover { color: var(--text-muted); }

.thinking-body {
  padding: 6px 8px;
  font-size: var(--text-xs);
  line-height: 1.4;
  background: var(--bg-base);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
  color: var(--text-faint);
}

/* ── Empty / drop zone ─────────────────────────────────────────────────── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--text-muted);
}

.drop-zone {
  width: 340px;
  height: 180px;
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: var(--text-sm);
  color: var(--text-faint);
  transition: border-color 0.15s, color 0.15s;
  cursor: pointer;
}
.drop-zone-active {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

.drop-icon { font-size: 32px; opacity: 0.5; }

/* ── Status bar ────────────────────────────────────────────────────────── */
.status-bar {
  padding: 6px 16px;
  font-size: 11px;
  color: var(--text-faint);
  background: var(--bg-sunken);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

/* ── Raw-JSON modal ────────────────────────────────────────────────────── */
.raw-json-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 32px;
}

.raw-json-modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  width: 100%;
  height: 100%;
  max-width: 1400px;
  max-height: 1100px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.raw-json-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-sunken);
  flex-shrink: 0;
}

.raw-json-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.raw-json-close {
  flex-shrink: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 18px;
  font-weight: 600;
  line-height: 1;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.raw-json-close:hover {
  background: #ff6b6b;
  border-color: #ff6b6b;
  color: #fff;
}

.raw-json-copy {
  flex-shrink: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  cursor: pointer;
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.raw-json-copy:hover {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #fff;
}
.raw-json-copy-copied { color: var(--success); border-color: var(--success); }
.raw-json-copy-copied:hover { background: var(--success); color: #fff; }
.raw-json-copy-failed { color: var(--needs-input); border-color: var(--needs-input); }
.raw-json-copy-failed:hover { background: var(--needs-input); color: #fff; }

.raw-json-body {
  margin: 0;
  padding: 14px 16px;
  overflow: auto;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-base);
  white-space: pre;
  flex: 1;
}

.raw-json-body-tree { white-space: normal; padding: 12px 8px; }
.raw-json-body-empty {
  white-space: normal;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-style: italic;
}

.raw-json-tabs {
  display: inline-flex;
  background: var(--bg-base);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
  flex-shrink: 0;
}

.raw-json-tab {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1;
  padding: 6px 12px;
  border-radius: 3px;
  transition: background 0.15s, color 0.15s;
}
.raw-json-tab:hover { color: var(--text-primary); }
.raw-json-tab-active {
  background: var(--bg-elevated);
  color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
}

/* ── JSON tree ─────────────────────────────────────────────────────────── */
.json-tree {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.55;
  color: var(--text-primary);
}

.json-row { display: block; white-space: nowrap; }
.json-key { color: var(--accent-secondary); }
.json-string { color: var(--success); }
.json-number { color: var(--accent-primary); }
.json-boolean { color: var(--accent-primary); }
.json-null { color: var(--text-faint); font-style: italic; }
.json-punct { color: var(--text-muted); }
.json-collapsed-summary { color: var(--text-faint); font-style: italic; }

.json-toggle {
  background: transparent;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 9px;
  line-height: 1;
  padding: 0 6px 0 0;
  font-family: var(--font-mono);
}
.json-toggle:hover { color: var(--accent-primary); }

.json-string-block {
  margin: 4px 0;
  padding: 8px 12px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--success);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: auto;
  max-width: calc(100% - 32px);
}

/* ── Dedupe toggle ─────────────────────────────────────────────────────── */
.header-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

.header-toggle input[type="checkbox"] {
  accent-color: var(--accent-primary);
  width: 14px;
  height: 14px;
  cursor: pointer;
}

/* ── Suppressed messages summary ───────────────────────────────────────── */
.suppressed-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 12px;
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-faint);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: color 0.1s, border-color 0.1s;
}
.suppressed-summary:hover {
  color: var(--text-muted);
  border-color: var(--text-faint);
}
.suppressed-expand-hint {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-faint);
}

/* ── New-context sidebar indicator ─────────────────────────────────────── */
.sidebar-new-context {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 12px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent-secondary);
  border-left: 3px solid transparent;
}

.sidebar-new-context::before {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--accent-secondary);
  opacity: 0.3;
}

.sidebar-new-context-label {
  flex-shrink: 0;
}

.sidebar-new-context::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--accent-secondary);
  opacity: 0.3;
}

/* ── Scrollbar styling ─────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script>
"use strict";

const e = React.createElement;
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── Utilities ──────────────────────────────────────────────────────────

async function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch { /* fall through */ }
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
  ta.setAttribute("readonly", "");
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function expandEmbeddedJson(value, depth) {
  if (depth === undefined) depth = 0;
  if (depth > 8) return value;
  if (typeof value === "string") {
    const trimmed = value.trim();
    if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
      try {
        const parsed = JSON.parse(value);
        if (parsed !== null && typeof parsed === "object") {
          return expandEmbeddedJson(parsed, depth + 1);
        }
      } catch { /* not JSON */ }
    }
    return value;
  }
  if (Array.isArray(value)) {
    return value.map(function(v) { return expandEmbeddedJson(v, depth + 1); });
  }
  if (value !== null && typeof value === "object") {
    const out = {};
    for (const [k, v] of Object.entries(value)) {
      out[k] = expandEmbeddedJson(v, depth + 1);
    }
    return out;
  }
  return value;
}

function prettyJsonOrRaw(payload) {
  try {
    return JSON.stringify(expandEmbeddedJson(JSON.parse(payload)), null, 2);
  } catch {
    return payload;
  }
}

function tryParse(s) {
  try { return { ok: true, value: JSON.parse(s) }; }
  catch { return { ok: false }; }
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

// Strip cache_control from content blocks so two messages that differ only
// in caching metadata compare as equal.
function stripCacheControl(msg) {
  var m = Object.assign({}, msg);
  var c = m.content;
  if (Array.isArray(c)) {
    m.content = c.map(function(block) {
      if (block && typeof block === "object" && !Array.isArray(block)) {
        var b = {};
        for (var k in block) { if (k !== "cache_control") b[k] = block[k]; }
        return b;
      }
      return block;
    });
  }
  return JSON.stringify(m, Object.keys(m).sort());
}

// For each call i, compute how many leading messages from call i-1 match
// call i (content-equal ignoring cache_control). Returns an array of
// { matchLen, isContinuation } where isContinuation means prev call's
// messages (possibly minus the last one) are all a prefix of this call.
function computePrefixInfo(calls) {
  var info = [{ matchLen: 0, isContinuation: false }];
  for (var i = 1; i < calls.length; i++) {
    var prev = (calls[i - 1].messages || []);
    var curr = (calls[i].messages || []);
    var matchLen = 0;
    for (var j = 0; j < Math.min(prev.length, curr.length); j++) {
      if (stripCacheControl(prev[j]) === stripCacheControl(curr[j])) {
        matchLen++;
      } else {
        break;
      }
    }
    // "continuation" = all of prev's messages match (or all but the last,
    // which is often a "continue" prompt whose cache_control / content
    // wrapper changes between calls).
    var isContinuation = matchLen >= prev.length - 1 && matchLen > 0;
    info.push({ matchLen: matchLen, isContinuation: isContinuation });
  }
  return info;
}

function formatTime(ts) {
  if (!ts) return "—";
  try {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch { return ts; }
}

// ── JSON Tree (ported from PureClaw) ───────────────────────────────────

const INDENT_PX = 16;

function JsonTree({ value }) {
  return e("div", { className: "json-tree" },
    e(JsonValue, { value: value, indent: 0, trailing: false, keyPrefix: null })
  );
}

function JsonValue({ value, indent, trailing, keyPrefix }) {
  if (value === null) {
    return e(PrimitiveRow, { indent, keyPrefix, trailing, className: "json-null", text: "null" });
  }
  const t = typeof value;
  if (t === "string") {
    return e(StringRow, { value, indent, trailing, keyPrefix });
  }
  if (t === "number" || t === "boolean") {
    return e(PrimitiveRow, {
      indent, keyPrefix, trailing,
      className: t === "number" ? "json-number" : "json-boolean",
      text: String(value)
    });
  }
  if (Array.isArray(value)) {
    return e(ArrayNode, { value, indent, trailing, keyPrefix });
  }
  if (t === "object") {
    return e(ObjectNode, { value, indent, trailing, keyPrefix });
  }
  return e(PrimitiveRow, { indent, keyPrefix, trailing, className: "json-string", text: String(value) });
}

function KeyPrefix({ name }) {
  return e(React.Fragment, null,
    e("span", { className: "json-key" }, '"' + name + '"'),
    e("span", { className: "json-punct" }, ": ")
  );
}

function PrimitiveRow({ indent, keyPrefix, trailing, className, text }) {
  return e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
    keyPrefix !== null && e(KeyPrefix, { name: keyPrefix }),
    e("span", { className }, text),
    trailing && e("span", { className: "json-punct" }, ",")
  );
}

function StringRow({ value, indent, trailing, keyPrefix }) {
  const multiline = value.includes("\n");
  if (!multiline) {
    return e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
      keyPrefix !== null && e(KeyPrefix, { name: keyPrefix }),
      e("span", { className: "json-string" }, '"' + value + '"'),
      trailing && e("span", { className: "json-punct" }, ",")
    );
  }
  return e(React.Fragment, null,
    e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
      keyPrefix !== null && e(KeyPrefix, { name: keyPrefix }),
      e("span", { className: "json-string" }, '"')
    ),
    e("pre", { className: "json-string-block", style: { marginLeft: (indent + 1) * INDENT_PX } }, value),
    e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
      e("span", { className: "json-string" }, '"'),
      trailing && e("span", { className: "json-punct" }, ",")
    )
  );
}

function Toggle({ expanded, onToggle }) {
  return e("button", {
    type: "button",
    className: "json-toggle",
    "aria-label": expanded ? "Collapse" : "Expand",
    onClick: onToggle
  }, expanded ? "\u25BC" : "\u25B6");
}

function ObjectNode({ value, indent, trailing, keyPrefix }) {
  const [expanded, setExpanded] = useState(true);
  const entries = Object.entries(value);

  if (entries.length === 0) {
    return e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
      keyPrefix !== null && e(KeyPrefix, { name: keyPrefix }),
      e("span", { className: "json-punct" }, "{}"),
      trailing && e("span", { className: "json-punct" }, ",")
    );
  }

  const opening = e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
    e(Toggle, { expanded, onToggle: function() { setExpanded(!expanded); } }),
    keyPrefix !== null && e(KeyPrefix, { name: keyPrefix }),
    e("span", { className: "json-punct" }, "{"),
    !expanded && e(React.Fragment, null,
      e("span", { className: "json-collapsed-summary" },
        " " + entries.length + (entries.length === 1 ? " key " : " keys ")
      ),
      e("span", { className: "json-punct" }, "}"),
      trailing && e("span", { className: "json-punct" }, ",")
    )
  );

  if (!expanded) return opening;

  return e(React.Fragment, null,
    opening,
    entries.map(function([k, v], i) {
      return e(JsonValue, { key: k, value: v, indent: indent + 1, trailing: i < entries.length - 1, keyPrefix: k });
    }),
    e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
      e("span", { className: "json-punct" }, "}"),
      trailing && e("span", { className: "json-punct" }, ",")
    )
  );
}

function ArrayNode({ value, indent, trailing, keyPrefix }) {
  const [expanded, setExpanded] = useState(true);

  if (value.length === 0) {
    return e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
      keyPrefix !== null && e(KeyPrefix, { name: keyPrefix }),
      e("span", { className: "json-punct" }, "[]"),
      trailing && e("span", { className: "json-punct" }, ",")
    );
  }

  const opening = e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
    e(Toggle, { expanded, onToggle: function() { setExpanded(!expanded); } }),
    keyPrefix !== null && e(KeyPrefix, { name: keyPrefix }),
    e("span", { className: "json-punct" }, "["),
    !expanded && e(React.Fragment, null,
      e("span", { className: "json-collapsed-summary" },
        " " + value.length + (value.length === 1 ? " item " : " items ")
      ),
      e("span", { className: "json-punct" }, "]"),
      trailing && e("span", { className: "json-punct" }, ",")
    )
  );

  if (!expanded) return opening;

  return e(React.Fragment, null,
    opening,
    value.map(function(v, i) {
      return e(JsonValue, { key: i, value: v, indent: indent + 1, trailing: i < value.length - 1, keyPrefix: null });
    }),
    e("div", { className: "json-row", style: { paddingLeft: indent * INDENT_PX } },
      e("span", { className: "json-punct" }, "]"),
      trailing && e("span", { className: "json-punct" }, ",")
    )
  );
}

// ── Raw JSON Modal (ported from PureClaw) ──────────────────────────────

const openModalStack = [];

function CopyJsonButton({ text }) {
  const [state, setState] = useState("idle");
  const timerRef = useRef(null);

  useEffect(function() {
    return function() { if (timerRef.current != null) clearTimeout(timerRef.current); };
  }, []);

  function onClick() {
    copyTextToClipboard(text).then(function(ok) {
      setState(ok ? "copied" : "failed");
      if (timerRef.current != null) clearTimeout(timerRef.current);
      timerRef.current = setTimeout(function() { setState("idle"); }, 1400);
    });
  }

  const label = state === "copied" ? "Copied" : state === "failed" ? "Copy failed" : "Copy";
  let cls = "raw-json-copy";
  if (state === "copied") cls += " raw-json-copy-copied";
  if (state === "failed") cls += " raw-json-copy-failed";

  return e("button", { className: cls, "aria-label": "Copy raw JSON to clipboard", title: label, onClick }, label);
}

function RawJsonModal({ title, body, onClose }) {
  const onCloseRef = useRef(onClose);
  useEffect(function() { onCloseRef.current = onClose; });

  const closeBtnRef = useRef(null);
  const pretty = useMemo(function() { return prettyJsonOrRaw(body); }, [body]);
  const parsed = useMemo(function() { return tryParse(body); }, [body]);
  const [tab, setTab] = useState("formatted");

  useEffect(function() {
    const id = Symbol("raw-json-modal");
    openModalStack.push(id);
    if (closeBtnRef.current) closeBtnRef.current.focus();

    function onKey(ev) {
      if (ev.key !== "Escape") return;
      if (openModalStack[openModalStack.length - 1] !== id) return;
      ev.stopPropagation();
      onCloseRef.current();
    }
    window.addEventListener("keydown", onKey);

    return function() {
      window.removeEventListener("keydown", onKey);
      const idx = openModalStack.indexOf(id);
      if (idx >= 0) openModalStack.splice(idx, 1);
    };
  }, []);

  const bodyContent = tab === "formatted"
    ? (parsed.ok
        ? e("div", { className: "raw-json-body raw-json-body-tree" },
            e(JsonTree, { value: expandEmbeddedJson(parsed.value) })
          )
        : e("div", { className: "raw-json-body raw-json-body-empty" },
            "Payload is not valid JSON. Use the Raw tab to view the source."
          )
      )
    : e("pre", { className: "raw-json-body" }, pretty);

  return ReactDOM.createPortal(
    e("div", {
      className: "raw-json-backdrop",
      onClick: function() { onCloseRef.current(); }
    },
      e("div", {
        className: "raw-json-modal",
        role: "dialog",
        "aria-modal": "true",
        onClick: function(ev) { ev.stopPropagation(); }
      },
        e("div", { className: "raw-json-header" },
          e("span", { className: "raw-json-title" }, title),
          e("div", { className: "raw-json-tabs", role: "tablist" },
            e("button", {
              role: "tab", "aria-selected": tab === "formatted",
              className: "raw-json-tab" + (tab === "formatted" ? " raw-json-tab-active" : ""),
              onClick: function() { setTab("formatted"); }
            }, "Formatted"),
            e("button", {
              role: "tab", "aria-selected": tab === "raw",
              className: "raw-json-tab" + (tab === "raw" ? " raw-json-tab-active" : ""),
              onClick: function() { setTab("raw"); }
            }, "Raw")
          ),
          e(CopyJsonButton, { text: body }),
          e("button", {
            ref: closeBtnRef,
            className: "raw-json-close",
            "aria-label": "Close raw JSON view",
            title: "Close (Esc)",
            onClick: function() { onCloseRef.current(); }
          }, "\u00D7")
        ),
        bodyContent
      )
    ),
    document.body
  );
}

// ── Content renderers ──────────────────────────────────────────────────

function TextContent({ text }) {
  if (!text) return null;
  // Truncate very long text in the message view
  const display = text.length > 2000 ? text.slice(0, 2000) + "\n\n... (" + text.length.toLocaleString() + " chars total)" : text;
  return e("div", { className: "content-block text-content" }, display);
}

function ToolUseBlock({ block }) {
  const [expanded, setExpanded] = useState(false);
  const inputStr = block.input ? JSON.stringify(block.input, null, 2) : "{}";
  // Show a brief summary even when collapsed
  const summary = block.name || "tool_use";

  return e("div", { className: "content-block tool-block" },
    e("div", { className: "tool-header", onClick: function() { setExpanded(!expanded); } },
      e("span", { className: "tool-toggle" }, expanded ? "\u25BC" : "\u25B6"),
      e("span", { className: "tool-name" }, summary),
      block.id && e("span", { className: "tool-id" }, " " + block.id)
    ),
    expanded && e("div", { className: "tool-body" }, inputStr)
  );
}

function ToolResultBlock({ block }) {
  const [expanded, setExpanded] = useState(false);
  let contentStr;
  if (typeof block.content === "string") {
    contentStr = block.content;
  } else if (block.content) {
    contentStr = JSON.stringify(block.content, null, 2);
  } else {
    contentStr = "(empty)";
  }
  // Truncate very long results in the expanded view
  const display = contentStr.length > 5000
    ? contentStr.slice(0, 5000) + "\n\n... (" + contentStr.length.toLocaleString() + " chars total)"
    : contentStr;

  return e("div", { className: "content-block tool-block" },
    e("div", { className: "tool-header", onClick: function() { setExpanded(!expanded); } },
      e("span", { className: "tool-toggle" }, expanded ? "\u25BC" : "\u25B6"),
      e("span", { className: "tool-name" }, "tool_result"),
      block.is_error && e("span", { className: "tool-error" }, " (error)"),
      block.tool_use_id && e("span", { className: "tool-id" }, " " + block.tool_use_id)
    ),
    expanded && e("div", { className: "tool-body" + (block.is_error ? " tool-error" : "") }, display)
  );
}

function ThinkingBlock({ block }) {
  const [expanded, setExpanded] = useState(false);
  const text = block.thinking || block.text || "";
  const display = text.length > 3000
    ? text.slice(0, 3000) + "\n\n... (" + text.length.toLocaleString() + " chars total)"
    : text;

  return e("div", { className: "content-block thinking-block" },
    e("div", { className: "thinking-header", onClick: function() { setExpanded(!expanded); } },
      e("span", { className: "tool-toggle" }, expanded ? "\u25BC" : "\u25B6"),
      "thinking"
    ),
    expanded && e("div", { className: "thinking-body" }, display)
  );
}

function ContentBlockRenderer({ block }) {
  if (!block) return null;
  if (typeof block === "string") return e(TextContent, { text: block });
  switch (block.type) {
    case "text":
      return e(TextContent, { text: block.text });
    case "tool_use":
      return e(ToolUseBlock, { block });
    case "tool_result":
      return e(ToolResultBlock, { block });
    case "thinking":
      return e(ThinkingBlock, { block });
    default:
      return e("div", { className: "content-block text-content" },
        JSON.stringify(block, null, 2)
      );
  }
}

function MessageBlock({ message, onClick }) {
  const role = message.role || "unknown";
  const content = message.content;

  let blocks;
  if (typeof content === "string") {
    blocks = [e(TextContent, { key: 0, text: content })];
  } else if (Array.isArray(content)) {
    blocks = content.map(function(block, i) {
      return e(ContentBlockRenderer, { key: i, block });
    });
  } else if (content) {
    blocks = [e(TextContent, { key: 0, text: JSON.stringify(content) })];
  } else {
    blocks = [e(TextContent, { key: 0, text: "(empty)" })];
  }

  return e("div", {
    className: "message-block role-" + role,
    onClick: onClick
  },
    e("div", { className: "message-header" }, role),
    e("div", { className: "message-body" }, blocks)
  );
}

// ── Sidebar item ───────────────────────────────────────────────────────

function SidebarItem({ call, index, active, onClick, isNewContext }) {

// ── Conversation view ──────────────────────────────────────────────────

function ConversationView({ calls, selectedIndex, rawLines, prefixInfo, showNewOnly }) {
  const [modal, setModal] = useState(null);
  const [expandSuppressed, setExpandSuppressed] = useState(false);
  const scrollRef = useRef(null);

  // Reset expand-suppressed when switching calls
  useEffect(function() {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    setExpandSuppressed(false);
  }, [selectedIndex]);

  if (selectedIndex < 0 || selectedIndex >= calls.length) {
    return e("div", { className: "conversation-panel" },
      e("div", { className: "empty-state" }, "Select a call from the sidebar")
    );
  }

  const call = calls[selectedIndex];
  const messages = call.messages || [];
  const info = prefixInfo[selectedIndex];
  const suppressUpTo = (showNewOnly && info.isContinuation && !expandSuppressed)
    ? info.matchLen : 0;

  // Build metadata header
  const metaItems = [];
  if (call.model) metaItems.push({ label: "Model", value: call.model });
  if (call.ts) metaItems.push({ label: "Time", value: formatTime(call.ts) });
  metaItems.push({ label: "Messages", value: String(messages.length) });
  if (call.max_tokens) metaItems.push({ label: "Max tokens", value: call.max_tokens.toLocaleString() });
  if (call.thinking) metaItems.push({ label: "Thinking", value: call.thinking.type || "enabled" });
  if (call.stream !== undefined) metaItems.push({ label: "Stream", value: String(call.stream) });
  if (call._response) {
    var rs = call._response.status;
    var stopReason = call._response.body && call._response.body.stop_reason;
    metaItems.push({ label: "Response", value: (rs || "?") + (stopReason ? " (" + stopReason + ")" : "") });
  }
  if (info.isContinuation) {
    metaItems.push({ label: "Shared", value: info.matchLen + " of " + messages.length });
  }

  // Build message list with delta marker and suppression
  const messageElements = [];

  if (suppressUpTo > 0) {
    messageElements.push(
      e("div", {
        key: "suppressed",
        className: "suppressed-summary",
        onClick: function() { setExpandSuppressed(true); }
      },
        suppressUpTo + " repeated message" + (suppressUpTo === 1 ? "" : "s") + " hidden (same as previous call)",
        e("span", { className: "suppressed-expand-hint" }, "click to expand")
      )
    );
  }

  var newCount = messages.length - info.matchLen;
  for (let i = (suppressUpTo > 0 ? suppressUpTo : 0); i < messages.length; i++) {
    // Show the delta marker at the boundary between shared & new
    if (i === info.matchLen && info.matchLen > 0 && newCount > 0 && (expandSuppressed || !info.isContinuation || !showNewOnly)) {
      messageElements.push(
        e("div", { key: "delta-" + i, className: "delta-marker" },
          "new in this call (" + newCount + " message" + (newCount === 1 ? "" : "s") + ")"
        )
      );
    } else if (i === suppressUpTo && suppressUpTo > 0 && newCount > 0) {
      // When we suppressed messages, mark the start of new content
      messageElements.push(
        e("div", { key: "delta-" + i, className: "delta-marker" },
          "new in this call (" + newCount + " message" + (newCount === 1 ? "" : "s") + ")"
        )
      );
    }
    const msg = messages[i];
    messageElements.push(
      e(MessageBlock, {
        key: "msg-" + i,
        message: msg,
        onClick: function() {
          setModal({ title: "Message #" + i + " (" + (msg.role || "unknown") + ")", body: JSON.stringify(msg, null, 2) });
        }
      })
    );
  }

  // If there's a _response with a body, render it as the assistant's reply
  const resp = call._response;
  const respBody = resp && resp.body;
  if (respBody && respBody.content) {
    messageElements.push(
      e("div", { key: "resp-marker", className: "delta-marker", style: { color: "var(--success)" } },
        "response (status " + (resp.status || "?") + ")"
      )
    );
    const respMsg = { role: respBody.role || "assistant", content: respBody.content };
    messageElements.push(
      e(MessageBlock, {
        key: "response",
        message: respMsg,
        onClick: function() {
          setModal({ title: "Response #" + selectedIndex, body: JSON.stringify(respBody, null, 2) });
        }
      })
    );
  } else if (resp && resp.error) {
    messageElements.push(
      e("div", { key: "resp-marker", className: "delta-marker", style: { color: "var(--needs-input)" } },
        "error response (status " + (resp.status || "?") + ")"
      )
    );
    messageElements.push(
      e("div", {
        key: "response-error",
        className: "message-block role-system",
        style: { cursor: "pointer" },
        onClick: function() {
          setModal({ title: "Error response #" + selectedIndex, body: JSON.stringify(resp, null, 2) });
        }
      },
        e("div", { className: "message-header" }, "error"),
        e("div", { className: "message-body" },
          e("div", { className: "content-block text-content" }, typeof resp.error === "string" ? resp.error : JSON.stringify(resp.error))
        )
      )
    );
  }

  function openFullRequest() {
    const body = rawLines[selectedIndex] || JSON.stringify(call, null, 2);
    setModal({ title: "Full request #" + selectedIndex, body });
  }

  var buttons = [
    e("button", { key: "req", className: "view-full-btn", onClick: openFullRequest }, "View full request JSON")
  ];
  if (resp) {
    buttons.push(
      e("button", {
        key: "resp",
        className: "view-full-btn",
        onClick: function() {
          setModal({ title: "Response #" + selectedIndex, body: JSON.stringify(resp, null, 2) });
        }
      }, "View full response JSON")
    );
  }

  return e("div", { className: "conversation-panel" },
    e("div", { className: "request-meta" },
      metaItems.map(function(item, i) {
        return e("div", { key: i, className: "meta-item" },
          e("span", { className: "meta-label" }, item.label + ": "),
          e("span", { className: "meta-value" }, item.value)
        );
      })
    ),
    e("div", { ref: scrollRef, className: "conversation-scroll" },
      messageElements,
      e("div", { style: { display: "flex", gap: "8px", justifyContent: "center" } }, buttons)
    ),
    modal && e(RawJsonModal, {
      title: modal.title,
      body: modal.body,
      onClose: function() { setModal(null); }
    })
  );
}

// ── Drop zone / empty state ────────────────────────────────────────────

function DropZone({ onLoad }) {
  const [active, setActive] = useState(false);
  const inputRef = useRef(null);

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      onLoad(file.name, ev.target.result);
    };
    reader.readAsText(file);
  }

  function onDragOver(ev) {
    ev.preventDefault();
    setActive(true);
  }

  function onDragLeave() { setActive(false); }

  function onDrop(ev) {
    ev.preventDefault();
    setActive(false);
    if (ev.dataTransfer.files.length > 0) {
      handleFile(ev.dataTransfer.files[0]);
    }
  }

  function onFileChange(ev) {
    if (ev.target.files.length > 0) {
      handleFile(ev.target.files[0]);
    }
  }

  return e("div", { className: "empty-state" },
    e("div", {
      className: "drop-zone" + (active ? " drop-zone-active" : ""),
      onDragOver,
      onDragLeave,
      onDrop,
      onClick: function() { inputRef.current && inputRef.current.click(); }
    },
      e("div", { className: "drop-icon" }, "\uD83D\uDCC4"),
      e("div", null, "Drop a .jsonl file here"),
      e("div", { style: { fontSize: "11px" } }, "or click to browse")
    ),
    e("input", {
      ref: inputRef,
      type: "file",
      accept: ".jsonl,.json,.ndjson",
      style: { display: "none" },
      onChange: onFileChange
    })
  );
}

// ── App ────────────────────────────────────────────────────────────────

function App() {
  const [calls, setCalls] = useState([]);
  const [rawLines, setRawLines] = useState([]);
  const [selectedIndex, setSelectedIndex] = useState(-1);
  const [fileName, setFileName] = useState(null);
  const [totalBytes, setTotalBytes] = useState(0);
  const [showNewOnly, setShowNewOnly] = useState(true);
  const inputRef = useRef(null);

  const prefixInfo = useMemo(function() { return computePrefixInfo(calls); }, [calls]);

  function loadData(name, text) {
    setTotalBytes(new Blob([text]).size);
    const lines = text.split("\n").filter(function(l) { return l.trim().length > 0; });
    const raw = [];
    const parsed = [];
    for (let i = 0; i < lines.length; i++) {
      raw.push(lines[i]);
      try {
        parsed.push(JSON.parse(lines[i]));
      } catch (err) {
        parsed.push({ _parseError: true, _raw: lines[i], _error: err.message });
      }
    }
    setRawLines(raw);
    setCalls(parsed);
    setSelectedIndex(parsed.length > 0 ? 0 : -1);
    setFileName(name);
  }

  function onFileChange(ev) {
    if (ev.target.files.length > 0) {
      const file = ev.target.files[0];
      const reader = new FileReader();
      reader.onload = function(fev) { loadData(file.name, fev.target.result); };
      reader.readAsText(file);
    }
  }

  // Global drag-and-drop on window
  useEffect(function() {
    function onDragOver(ev) { ev.preventDefault(); }
    function onDrop(ev) {
      ev.preventDefault();
      if (ev.dataTransfer.files.length > 0) {
        const file = ev.dataTransfer.files[0];
        const reader = new FileReader();
        reader.onload = function(fev) { loadData(file.name, fev.target.result); };
        reader.readAsText(file);
      }
    }
    window.addEventListener("dragover", onDragOver);
    window.addEventListener("drop", onDrop);
    return function() {
      window.removeEventListener("dragover", onDragOver);
      window.removeEventListener("drop", onDrop);
    };
  }, []);

  // Keyboard navigation
  useEffect(function() {
    function onKey(ev) {
      if (openModalStack.length > 0) return;
      if (ev.key === "ArrowDown" || ev.key === "j") {
        ev.preventDefault();
        setSelectedIndex(function(i) { return Math.min(i + 1, calls.length - 1); });
      } else if (ev.key === "ArrowUp" || ev.key === "k") {
        ev.preventDefault();
        setSelectedIndex(function(i) { return Math.max(i - 1, 0); });
      }
    }
    window.addEventListener("keydown", onKey);
    return function() { window.removeEventListener("keydown", onKey); };
  }, [calls.length]);

  const hasData = calls.length > 0;

  return e("div", { className: "app" },
    e("div", { className: "header" },
      e("span", { className: "header-title" }, "JSONL Capture Viewer"),
      e("span", { className: "header-spacer" }),
      hasData && e("label", { className: "header-toggle" },
        e("input", {
          type: "checkbox",
          checked: showNewOnly,
          onChange: function(ev) { setShowNewOnly(ev.target.checked); }
        }),
        "Show new only"
      ),
      e("button", {
        className: "load-btn",
        onClick: function() { inputRef.current && inputRef.current.click(); }
      }, hasData ? "Load another file..." : "Load file..."),
      e("input", {
        ref: inputRef,
        type: "file",
        accept: ".jsonl,.json,.ndjson",
        style: { display: "none" },
        onChange: onFileChange
      })
    ),
    hasData
      ? e("div", { className: "main-content" },
          e("div", { className: "sidebar" },
            e("div", { className: "sidebar-header" }, "Calls"),
            e("div", { className: "sidebar-list" },
              calls.map(function(call, i) {
                return e(SidebarItem, {
                  key: i,
                  call,
                  index: i,
                  active: i === selectedIndex,
                  onClick: function() { setSelectedIndex(i); },
                  isNewContext: i > 0 && !prefixInfo[i].isContinuation
                });
              })
            )
          ),
          e(ConversationView, { calls, selectedIndex, rawLines, prefixInfo, showNewOnly })
        )
      : e(DropZone, { onLoad: loadData }),
    e("div", { className: "status-bar" },
      hasData
        ? (function() {
            var nCtx = prefixInfo.filter(function(p) { return !p.isContinuation; }).length;
            var nCont = calls.length - nCtx;
            return "Status: " + calls.length + " calls loaded" +
              (fileName ? " from " + fileName : "") +
              ", " + formatBytes(totalBytes) +
              " | " + nCont + " continuations, " + nCtx + " new contexts";
          })()
        : "No file loaded — drop a .jsonl file or click Load file"
    )
  );
}

// ── Mount ──────────────────────────────────────────────────────────────

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
